persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

# MQTT TCP cho thiết bị ESP32 / backend
listener 1883
# DEV ONLY: production nên tắt anonymous và dùng password_file + ACL
allow_anonymous true
# password_file /mosquitto/config/passwd
# acl_file /mosquitto/config/acl

# MQTT over WebSocket (debug bằng MQTT Explorer / browser)
listener 9001
protocol websockets

