# Mosquitto config for the Smart Parking demo (Mosquitto 2.x)
#
# Run from the repo root:
#   D:\mosquitto\mosquitto.exe -c infra\mosquitto\mosquitto.conf -v

# Mosquitto 2.x only listens on localhost by default.
# Bind to all interfaces so the ESP32 on the LAN can connect.
listener 1883 0.0.0.0

# Mosquitto 2.x rejects clients without credentials by default.
# Anonymous access is acceptable for a closed-LAN classroom demo.
allow_anonymous true
